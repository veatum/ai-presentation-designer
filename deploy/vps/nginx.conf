server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 139.100.239.187;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://139.100.239.187$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 139.100.239.187;

    ssl_certificate /etc/letsencrypt/live/139.100.239.187/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/139.100.239.187/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    server_tokens off;

    # Temporarily public for the hackathon, at the owner's request.
    # To restore password access, uncomment both directives below.
    # auth_basic "Presentation Designer";
    # auth_basic_user_file /etc/presentation-designer/htpasswd;

    client_max_body_size 250m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}

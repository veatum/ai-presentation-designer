services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ai-presentation-designer:vps
    restart: unless-stopped
    init: true
    env_file:
      - /etc/presentation-designer/app.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - presentations:/app/outputs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  presentations:

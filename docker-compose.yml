services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-presentation-designer:7.4.2
    container_name: ai-presentation-designer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./outputs:/app/outputs
    init: true
    stop_grace_period: 30s
